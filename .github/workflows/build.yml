name: Build Auto Profit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          flutter create . \
            --platforms=android \
            --project-name auto_profit

          cat > pubspec.yaml <<'EOF'
          name: auto_profit
          description: Auto Profit
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.0.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            sqflite: ^2.4.1
            path: ^1.9.0
            path_provider: ^2.1.5
            image_picker: ^1.1.2
            file_picker: ^8.1.7
            open_filex: ^4.6.0
            intl: ^0.19.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          EOF

          rm -f test/widget_test.dart
          mkdir -p lib

          cat > lib/main.dart <<'DART'
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:sqflite/sqflite.dart';
          import 'package:path/path.dart' as p;
          import 'package:path_provider/path_provider.dart';
          import 'package:image_picker/image_picker.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:open_filex/open_filex.dart';
          import 'package:intl/intl.dart';

          const statuses = [
            'Куплен',
            'В ремонте',
            'Готов к продаже',
            'На продаже',
            'Продан'
          ];

          double val(String s) =>
              double.tryParse(s.replaceAll(' ', '').replaceAll(',', '.')) ?? 0;

          String money(num n) =>
              NumberFormat('#,##0.##', 'ru_RU').format(n);

          class DB {
            static Database? _db;

            static Future<Database> get open async {
              if (_db != null) return _db!;

              final dir = await getApplicationDocumentsDirectory();

              _db = await openDatabase(
                p.join(dir.path, 'auto_profit.db'),
                version: 1,
                onCreate: (db, version) async {
                  await db.execute(
                    'CREATE TABLE cars('
                    'id INTEGER PRIMARY KEY AUTOINCREMENT,'
                    'make TEXT, model TEXT, year INTEGER, vin TEXT, plate TEXT,'
                    'mileage INTEGER, purchaseDate TEXT, purchasePrice REAL,'
                    'seller TEXT, notes TEXT, status TEXT, salePrice REAL)',
                  );

                  await db.execute(
                    'CREATE TABLE categories('
                    'id INTEGER PRIMARY KEY AUTOINCREMENT,'
                    'name TEXT UNIQUE)',
                  );

                  await db.execute(
                    'CREATE TABLE expenses('
                    'id INTEGER PRIMARY KEY AUTOINCREMENT,'
                    'carId INTEGER, categoryId INTEGER, amount REAL,'
                    'note TEXT, date TEXT)',
                  );

                  await db.execute(
                    'CREATE TABLE files('
                    'id INTEGER PRIMARY KEY AUTOINCREMENT,'
                    'carId INTEGER, path TEXT, name TEXT, type TEXT)',
                  );

                  for (final name in [
                    'Ремонт',
                    'Запчасти',
                    'Шиномонтаж',
                    'Резина',
                    'Мойка',
                    'Детейлинг',
                    'Доставка',
                    'Диагностика',
                    'Комиссия',
                    'Прочее'
                  ]) {
                    await db.insert('categories', {'name': name});
                  }
                },
              );

              return _db!;
            }
          }

          class Car {
            int? id;
            int? year;
            int? mileage;
            String make;
            String model;
            String vin;
            String plate;
            String purchaseDate;
            String seller;
            String notes;
            String status;
            double purchasePrice;
            double salePrice;

            Car({
              this.id,
              this.year,
              this.mileage,
              this.make = '',
              this.model = '',
              this.vin = '',
              this.plate = '',
              this.purchaseDate = '',
              this.seller = '',
              this.notes = '',
              this.status = 'Куплен',
              this.purchasePrice = 0,
              this.salePrice = 0,
            });

            factory Car.from(Map<String, Object?> x) {
              return Car(
                id: x['id'] as int?,
                year: x['year'] as int?,
                mileage: x['mileage'] as int?,
                make: '${x['make'] ?? ''}',
                model: '${x['model'] ?? ''}',
                vin: '${x['vin'] ?? ''}',
                plate: '${x['plate'] ?? ''}',
                purchaseDate: '${x['purchaseDate'] ?? ''}',
                seller: '${x['seller'] ?? ''}',
                notes: '${x['notes'] ?? ''}',
                status: '${x['status'] ?? 'Куплен'}',
                purchasePrice:
                    (x['purchasePrice'] as num? ?? 0).toDouble(),
                salePrice:
                    (x['salePrice'] as num? ?? 0).toDouble(),
              );
            }
          }

          void main() {
            runApp(const AutoProfit());
          }

          class AutoProfit extends StatelessWidget {
            const AutoProfit({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Auto Profit',
                theme: ThemeData(
                  colorSchemeSeed: Colors.blue,
                  useMaterial3: true,
                ),
                home: const HomePage(),
              );
            }
          }

          class HomePage extends StatefulWidget {
            const HomePage({super.key});

            @override
            State<HomePage> createState() => _HomePageState();
          }

          class _HomePageState extends State<HomePage> {
            String search = '';

            Future<List<Map<String, Object?>>> cars() async {
              return (await DB.open).query(
                'cars',
                orderBy: 'id DESC',
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('Auto Profit'),
                ),
                floatingActionButton: FloatingActionButton(
                  onPressed: () async {
                    await Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (_) => const CarPage(),
                      ),
                    );
                    setState(() {});
                  },
                  child: const Icon(Icons.add),
                ),
                body: FutureBuilder<List<Map<String, Object?>>>(
                  future: cars(),
                  builder: (context, snap) {
                    if (!snap.hasData) {
                      return const Center(
                        child: CircularProgressIndicator(),
                      );
                    }

                    final all = snap.data!.map(Car.from).toList();

                    final list = all.where((car) {
                      final text =
                          '${car.make} ${car.model} ${car.vin} ${car.plate}'
                              .toLowerCase();
                      return text.contains(search.toLowerCase());
                    }).toList();

                    return Column(
                      children: [
                        Padding(
                          padding: const EdgeInsets.all(12),
                          child: TextField(
                            decoration: const InputDecoration(
                              labelText:
                                  'Поиск VIN, номера, марки или модели',
                              prefixIcon: Icon(Icons.search),
                              border: OutlineInputBorder(),
                            ),
                            onChanged: (v) {
                              setState(() => search = v);
                            },
                          ),
                        ),
                        Card(
                          child: ListTile(
                            title: Text(
                              'Автомобилей: ${all.length}',
                            ),
                            subtitle: const Text(
                              'Нажмите +, чтобы добавить автомобиль',
                            ),
                          ),
                        ),
                        Expanded(
                          child: list.isEmpty
                              ? const Center(
                                  child: Text(
                                    'Автомобилей пока нет',
                                  ),
                                )
                              : ListView.builder(
                                  itemCount: list.length,
                                  itemBuilder: (context, i) {
                                    final car = list[i];

                                    return Card(
                                      child: ListTile(
                                        title: Text(
                                          '${car.make} ${car.model} ${car.year ?? ''}',
                                        ),
                                        subtitle: Text(
                                          '${car.plate} • ${car.vin}\n'
                                          '${car.status}',
                                        ),
                                        isThreeLine: true,
                                        trailing: const Icon(
                                          Icons.chevron_right,
                                        ),
                                        onTap: () async {
                                          await Navigator.push(
                                            context,
                                            MaterialPageRoute(
                                              builder: (_) =>
                                                  CarPage(car: car),
                                            ),
                                          );
                                          setState(() {});
                                        },
                                      ),
                                    );
                                  },
                                ),
                        ),
                      ],
                    );
                  },
                ),
              );
            }
          }

          class CarPage extends StatefulWidget {
            final Car? car;

            const CarPage({
              super.key,
              this.car,
            });

            @override
            State<CarPage> createState() => _CarPageState();
          }

          class _CarPageState extends State<CarPage> {
            late Car car;

            final make = TextEditingController();
            final model = TextEditingController();
            final year = TextEditingController();
            final vin = TextEditingController();
            final plate = TextEditingController();
            final mileage = TextEditingController();
            final date = TextEditingController();
            final price = TextEditingController();
            final seller = TextEditingController();
            final notes = TextEditingController();
            final sale = TextEditingController();

            List<Map<String, Object?>> expenses = [];
            List<Map<String, Object?>> files = [];
            List<Map<String, Object?>> categories = [];
                        @override
            void initState() {
              super.initState();

              car = widget.car ??
                  Car(
                    purchaseDate:
                        DateFormat('dd.MM.yyyy').format(DateTime.now()),
                  );

              load();
            }

            Future<void> load() async {
              make.text = car.make;
              model.text = car.model;
              year.text = '${car.year ?? ''}';
              vin.text = car.vin;
              plate.text = car.plate;
              mileage.text = '${car.mileage ?? ''}';
              date.text = car.purchaseDate;
              price.text = '${car.purchasePrice}';
              seller.text = car.seller;
              notes.text = car.notes;
              sale.text =
                  car.salePrice == 0 ? '' : '${car.salePrice}';

              final db = await DB.open;

              if (car.id != null) {
                expenses = await db.rawQuery(
                  'SELECT e.*, c.name category '
                  'FROM expenses e '
                  'JOIN categories c ON c.id=e.categoryId '
                  'WHERE carId=? ORDER BY e.id DESC',
                  [car.id],
                );

                files = await db.query(
                  'files',
                  where: 'carId=?',
                  whereArgs: [car.id],
                  orderBy: 'id DESC',
                );
              }

              categories = await db.query(
                'categories',
                orderBy: 'name',
              );

              if (mounted) setState(() {});
            }

            Future<void> save() async {
              final db = await DB.open;

              final data = {
                'make': make.text,
                'model': model.text,
                'year': int.tryParse(year.text),
                'vin': vin.text,
                'plate': plate.text,
                'mileage': int.tryParse(mileage.text),
                'purchaseDate': date.text,
                'purchasePrice': val(price.text),
                'seller': seller.text,
                'notes': notes.text,
                'status': car.status,
                'salePrice': val(sale.text),
              };

              if (car.id == null) {
                car.id = await db.insert('cars', data);
              } else {
                await db.update(
                  'cars',
                  data,
                  where: 'id=?',
                  whereArgs: [car.id],
                );
              }

              await load();

              if (mounted) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(
                    content: Text('Автомобиль сохранён'),
                  ),
                );
              }
            }

            Future<void> addCategory() async {
              final controller = TextEditingController();

              await showDialog(
                context: context,
                builder: (dialogContext) {
                  return AlertDialog(
                    title: const Text('Новая категория'),
                    content: TextField(
                      controller: controller,
                      decoration: const InputDecoration(
                        labelText: 'Название',
                      ),
                    ),
                    actions: [
                      TextButton(
                        onPressed: () =>
                            Navigator.pop(dialogContext),
                        child: const Text('Отмена'),
                      ),
                      FilledButton(
                        onPressed: () async {
                          final name = controller.text.trim();

                          if (name.isNotEmpty) {
                            try {
                              await (await DB.open).insert(
                                'categories',
                                {'name': name},
                              );
                            } catch (_) {}
                          }

                          Navigator.pop(dialogContext);
                          await load();
                        },
                        child: const Text('Создать'),
                      ),
                    ],
                  );
                },
              );
            }

            Future<void> addExpense() async {
              if (car.id == null) {
                await save();
              }

              final amount = TextEditingController();
              final note = TextEditingController();

              int? categoryId = categories.isEmpty
                  ? null
                  : categories.first['id'] as int;

              await showDialog(
                context: context,
                builder: (dialogContext) {
                  return StatefulBuilder(
                    builder: (context, setDialogState) {
                      return AlertDialog(
                        title: const Text('Добавить расход'),
                        content: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            DropdownButtonFormField<int>(
                              initialValue: categoryId,
                              decoration: const InputDecoration(
                                labelText: 'Категория',
                              ),
                              items: categories.map((x) {
                                return DropdownMenuItem<int>(
                                  value: x['id'] as int,
                                  child: Text('${x['name']}'),
                                );
                              }).toList(),
                              onChanged: (v) {
                                setDialogState(
                                  () => categoryId = v,
                                );
                              },
                            ),
                            TextField(
                              controller: amount,
                              keyboardType:
                                  TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'Сумма',
                              ),
                            ),
                            TextField(
                              controller: note,
                              decoration: const InputDecoration(
                                labelText: 'Комментарий',
                              ),
                            ),
                          ],
                        ),
                        actions: [
                          TextButton(
                            onPressed: () =>
                                Navigator.pop(dialogContext),
                            child: const Text('Отмена'),
                          ),
                          FilledButton(
                            onPressed: () async {
                              if (categoryId != null &&
                                  val(amount.text) > 0) {
                                await (await DB.open).insert(
                                  'expenses',
                                  {
                                    'carId': car.id,
                                    'categoryId': categoryId,
                                    'amount': val(amount.text),
                                    'note': note.text,
                                    'date':
                                        DateTime.now().toIso8601String(),
                                  },
                                );
                              }

                              Navigator.pop(dialogContext);
                              await load();
                            },
                            child: const Text('Добавить'),
                          ),
                        ],
                      );
                    },
                  );
                },
              );
            }

            Future<void> addImage(bool camera) async {
              if (car.id == null) {
                await save();
              }

              final image =
                  await ImagePicker().pickImage(
                source: camera
                    ? ImageSource.camera
                    : ImageSource.gallery,
              );

              if (image == null) return;

              final dir =
                  await getApplicationDocumentsDirectory();

              final target = p.join(
                dir.path,
                '${DateTime.now().millisecondsSinceEpoch}_'
                '${p.basename(image.path)}',
              );

              await File(image.path).copy(target);

              await (await DB.open).insert(
                'files',
                {
                  'carId': car.id,
                  'path': target,
                  'name': p.basename(target),
                  'type': 'image',
                },
              );

              await load();
            }

            Future<void> addFile() async {
              if (car.id == null) {
                await save();
              }

              final result =
                  await FilePicker.platform.pickFiles();

              if (result == null ||
                  result.files.single.path == null) {
                return;
              }

              final source =
                  File(result.files.single.path!);

              final dir =
                  await getApplicationDocumentsDirectory();

              final target = p.join(
                dir.path,
                '${DateTime.now().millisecondsSinceEpoch}_'
                '${result.files.single.name}',
              );

              await source.copy(target);

              await (await DB.open).insert(
                'files',
                {
                  'carId': car.id,
                  'path': target,
                  'name': result.files.single.name,
                  'type': 'file',
                },
              );

              await load();
            }

            double get invested {
              return car.purchasePrice +
                  expenses.fold(
                    0.0,
                    (sum, x) =>
                        sum + (x['amount'] as num).toDouble(),
                  );
            }
                        @override
            Widget build(BuildContext context) {
              final profit = val(sale.text) - invested;

              return Scaffold(
                appBar: AppBar(
                  title: Text(
                    car.id == null
                        ? 'Новый автомобиль'
                        : 'Автомобиль',
                  ),
                ),
                body: ListView(
                  padding: const EdgeInsets.all(12),
                  children: [
                    Row(
                      children: [
                        Expanded(
                          child: field(
                            make,
                            'Марка',
                          ),
                        ),
                        const SizedBox(width: 8),
                        Expanded(
                          child: field(
                            model,
                            'Модель',
                          ),
                        ),
                      ],
                    ),
                    Row(
                      children: [
                        Expanded(
                          child: field(
                            year,
                            'Год',
                            number: true,
                          ),
                        ),
                        const SizedBox(width: 8),
                        Expanded(
                          child: field(
                            mileage,
                            'Пробег',
                            number: true,
                          ),
                        ),
                      ],
                    ),
                    field(vin, 'VIN'),
                    field(plate, 'Госномер'),
                    field(date, 'Дата покупки'),
                    field(
                      price,
                      'Цена покупки',
                      number: true,
                    ),
                    field(seller, 'Продавец'),
                    field(
                      notes,
                      'Заметки',
                      lines: 3,
                    ),
                    DropdownButtonFormField<String>(
                      initialValue:
                          statuses.contains(car.status)
                              ? car.status
                              : statuses.first,
                      decoration: const InputDecoration(
                        labelText: 'Статус',
                      ),
                      items: statuses.map((x) {
                        return DropdownMenuItem(
                          value: x,
                          child: Text(x),
                        );
                      }).toList(),
                      onChanged: (v) {
                        setState(() {
                          car.status =
                              v ?? car.status;
                        });
                      },
                    ),
                    const SizedBox(height: 10),
                    field(
                      sale,
                      'Цена продажи',
                      number: true,
                    ),
                    Card(
                      child: Padding(
                        padding: const EdgeInsets.all(16),
                        child: Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            const Text(
                              'Финансы',
                              style: TextStyle(
                                fontSize: 18,
                                fontWeight:
                                    FontWeight.bold,
                              ),
                            ),
                            const SizedBox(height: 8),
                            Text(
                              'Цена покупки: '
                              '${money(car.purchasePrice)} ₽',
                            ),
                            Text(
                              'Расходы: '
                              '${money(
                                invested -
                                    car.purchasePrice,
                              )} ₽',
                            ),
                            Text(
                              'Всего вложено: '
                              '${money(invested)} ₽',
                            ),
                            Text(
                              'Прибыль: '
                              '${money(profit)} ₽',
                            ),
                          ],
                        ),
                      ),
                    ),
                    Row(
                      children: [
                        Expanded(
                          child: FilledButton.icon(
                            onPressed: addExpense,
                            icon: const Icon(Icons.add),
                            label: const Text(
                              'Расход',
                            ),
                          ),
                        ),
                        const SizedBox(width: 8),
                        IconButton(
                          onPressed: addCategory,
                          tooltip:
                              'Новая категория',
                          icon: const Icon(
                            Icons.category,
                          ),
                        ),
                      ],
                    ),
                    ...expenses.map(
                      (x) => ListTile(
                        leading: const Icon(
                          Icons.receipt_long,
                        ),
                        title: Text(
                          '${x['category']}: '
                          '${money(
                            x['amount'] as num,
                          )} ₽',
                        ),
                        subtitle: Text(
                          '${x['note'] ?? ''}',
                        ),
                      ),
                    ),
                    const Divider(),
                    const Text(
                      'Фото и документы',
                      style: TextStyle(
                        fontSize: 18,
                        fontWeight:
                            FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 8),
                    Row(
                      children: [
                        Expanded(
                          child: OutlinedButton.icon(
                            onPressed: () =>
                                addImage(false),
                            icon: const Icon(
                              Icons.photo,
                            ),
                            label: const Text(
                              'Галерея',
                            ),
                          ),
                        ),
                        const SizedBox(width: 4),
                        Expanded(
                          child: OutlinedButton.icon(
                            onPressed: () =>
                                addImage(true),
                            icon: const Icon(
                              Icons.camera_alt,
                            ),
                            label: const Text(
                              'Камера',
                            ),
                          ),
                        ),
                        const SizedBox(width: 4),
                        Expanded(
                          child: OutlinedButton.icon(
                            onPressed: addFile,
                            icon: const Icon(
                              Icons.attach_file,
                            ),
                            label: const Text(
                              'Файл',
                            ),
                          ),
                        ),
                      ],
                    ),
                    ...files.map(
                      (x) => ListTile(
                        leading: Icon(
                          x['type'] == 'image'
                              ? Icons.image
                              : Icons.description,
                        ),
                        title: Text(
                          '${x['name']}',
                        ),
                        onTap: () {
                          OpenFilex.open(
                            '${x['path']}',
                          );
                        },
                      ),
                    ),
                                        const SizedBox(height: 12),
                    FilledButton.icon(
                      onPressed: save,
                      icon: const Icon(Icons.save),
                      label: const Text(
                        'Сохранить автомобиль',
                      ),
                    ),
                  ],
                ),
              );
            }

            Widget field(
              TextEditingController controller,
              String label, {
              bool number = false,
              int lines = 1,
            }) {
              return Padding(
                padding:
                    const EdgeInsets.only(bottom: 10),
                child: TextField(
                  controller: controller,
                  maxLines: lines,
                  keyboardType: number
                      ? TextInputType.number
                      : TextInputType.text,
                  decoration: InputDecoration(
                    labelText: label,
                    border:
                        const OutlineInputBorder(),
                  ),
                  onChanged: (_) {
                    if (label == 'Цена продажи') {
                      setState(() {});
                    }
                  },
                ),
              );
            }
          }
          DART

      - name: Get dependencies
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -e
          flutter analyze

      - name: Build APK
        shell: bash
        run: |
          set -e
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-profit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
