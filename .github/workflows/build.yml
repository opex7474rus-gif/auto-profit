name: Build Auto Profit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project archive
        run: |
          curl -L "https://github.com/${{ github.repository }}/raw/${{ github.ref_name }}/auto_profit_cloud_build.zip" -o project.zip

      - name: Extract project
        run: |
          unzip -q project.zip
          mv auto_profit_cloud/* .
          rm -rf auto_profit_cloud project.zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Create Android project
        run: |
          flutter create . --platforms=android --project-name auto_profit

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-profit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
