name: Build Auto Profit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -la
          file auto_profit_cloud_build.zip

      - name: Extract project
        run: |
          unzip -q auto_profit_cloud_build.zip
          cp -r auto_profit_cloud/* .
          rm -rf auto_profit_cloud auto_profit_cloud_build.zip

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Create Android project
        run: |
          flutter create . --platforms=android --project-name auto_profit

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-profit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
