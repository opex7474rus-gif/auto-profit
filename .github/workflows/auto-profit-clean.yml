name: Auto Profit BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Recreate Android project files
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name auto_profit

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Patch build.gradle.kts for signing
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle.kts")
          src = p.read_text()

          if "signingConfigs" not in src:
              block = '''
              signingConfigs {
                  create("release") {
                      val keystoreProperties = java.util.Properties()
                      val keystorePropertiesFile = rootProject.file("key.properties")
                      if (keystorePropertiesFile.exists()) {
                          keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
                      }
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }
              '''
              src = src.replace("android {", "android {" + block, 1)

          if "signingConfig = signingConfigs.getByName" not in src:
              src = re.sub(
                  r'(release\s*\{)',
                  r'\1\n            signingConfig = signingConfigs.getByName("release")',
                  src,
                  count=1,
              )

          p.write_text(src)
          print("build.gradle.kts обновлён")
          PY

      - name: Bump version automatically
        run: |
          VERSION="1.0.0+${{ github.run_number }}"
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          echo "Автоматическая версия: $VERSION"

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure launcher icon
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            convert -size 1024x1024 xc:'#1565C0' \
              -gravity center -fill white -pointsize 400 \
              -annotate 0 'AP' assets/icon.png
          fi

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          ls -lah build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-profit-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
