name: Auto Profit CLEAN BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Clean old project
        run: |
          rm -rf lib
          rm -rf test
          rm -rf android
          rm -rf ios
          rm -rf macos
          rm -rf linux
          rm -rf windows
          rm -rf web
          mkdir -p lib

      - name: Create Flutter project
        run: |
          flutter create . \
            --platforms=android \
            --project-name auto_profit

      - name: Remove generated Dart files
        run: |
          rm -rf lib
          rm -rf test
          mkdir -p lib

      - name: Create app source
        run: |
          cat > lib/main.dart <<'EOF'
              import 'package:flutter/material.dart';

    void main() {
      runApp(const AutoProfitApp());
    }

    class AutoProfitApp extends StatelessWidget {
      const AutoProfitApp({super.key});

      @override
      Widget build(BuildContext context) {
        return MaterialApp(
          debugShowCheckedModeBanner: false,
          title: 'Авто Профит',
          theme: ThemeData(
            colorScheme: ColorScheme.fromSeed(
              seedColor: Colors.blue,
            ),
            useMaterial3: true,
          ),
          home: const HomeScreen(),
        );
      }
    }

    class Car {
      String make;
      String model;
      String year;
      String vin;
      String plate;
      String mileage;
      String purchasePrice;
      String status;
      String seller;
      String notes;
      String salePrice;
      List<Expense> expenses;

      Car({
        required this.make,
        required this.model,
        required this.year,
        required this.vin,
        required this.plate,
        required this.mileage,
        required this.purchasePrice,
        required this.status,
        required this.seller,
        required this.notes,
        required this.salePrice,
        required this.expenses,
      });

      double get purchase =>
          double.tryParse(
            purchasePrice.replaceAll(',', '.'),
          ) ??
          0;

      double get sale =>
          double.tryParse(
            salePrice.replaceAll(',', '.'),
          ) ??
          0;

      double get expensesTotal =>
          expenses.fold(
            0,
            (sum, item) => sum + item.amount,
          );

      double get invested => purchase + expensesTotal;

      double get profit => sale - invested;
    }

    class Expense {
      String category;
      double amount;
      String note;

      Expense({
        required this.category,
        required this.amount,
        required this.note,
      });
    }

    class HomeScreen extends StatefulWidget {
      const HomeScreen({super.key});

      @override
      State<HomeScreen> createState() =>
          _HomeScreenState();
    }

    class _HomeScreenState extends State<HomeScreen> {
      final List<Car> cars = [];

      double get totalInvested =>
          cars.fold(
            0,
            (sum, car) => sum + car.invested,
          );

      double get totalProfit =>
          cars.fold(
            0,
            (sum, car) => sum + car.profit,
          );

      int countStatus(String status) {
        return cars
            .where((car) => car.status == status)
            .length;
      }

      void addCar() {
        Navigator.push(
          context,
          MaterialPageRoute(
            builder: (_) => CarFormScreen(
              onSave: (car) {
                setState(() {
                  cars.add(car);
                });
              },
            ),
          ),
        );
      }

      void openCar(Car car) {
        Navigator.push(
          context,
          MaterialPageRoute(
            builder: (_) => CarDetailsScreen(
              car: car,
              onChanged: () {
                setState(() {});
              },
            ),
          ),
        );
      }

      @override
      Widget build(BuildContext context) {
        return Scaffold(
          appBar: AppBar(
            title: const Text('Авто Профит'),
          ),
          floatingActionButton:
              FloatingActionButton.extended(
            onPressed: addCar,
            icon: const Icon(Icons.add),
            label: const Text('Добавить авто'),
          ),
          body: ListView(
            padding: const EdgeInsets.all(16),
            children: [
              const Text(
                'Панель управления',
                style: TextStyle(
                  fontSize: 24,
                  fontWeight: FontWeight.bold,
                ),
              ),
              const SizedBox(height: 16),
              Row(
                children: [
                  Expanded(
                    child: StatCard(
                      title: 'Автомобили',
                      value: '${cars.length}',
                      icon: Icons.directions_car,
                    ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
                    child: StatCard(
                      title: 'На продаже',
                      value:
                          '${countStatus('На продаже')}',
                      icon: Icons.sell,
                    ),
                  ),
                ],
              ),
              const SizedBox(height: 10),
              Row(
                children: [
                  Expanded(
                    child: StatCard(
                      title: 'Вложено',
                      value: money(totalInvested),
                      icon:
                          Icons.account_balance_wallet,
                    ),
                  ),
                  const SizedBox(width: 10),
                  Expanded(
                    child: StatCard(
                      title: 'Прибыль',
                      value: money(totalProfit),
                      icon: Icons.trending_up,
                    ),
                  ),
                ],
              ),
              const SizedBox(height: 20),
              Card(
                child: Padding(
                  padding: const EdgeInsets.all(16),
                  child: Column(
                    crossAxisAlignment:
                        CrossAxisAlignment.start,
                    children: [
                      const Text(
                        'Статусы',
                        style: TextStyle(
                          fontSize: 18,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      const SizedBox(height: 12),
                      statusRow(
                        'Куплен',
                        countStatus('Куплен'),
                      ),
                      statusRow(
                        'В ремонте',
                        countStatus('В ремонте'),
                      ),
                      statusRow(
                        'Готов к продаже',
                        countStatus(
                          'Готов к продаже',
                        ),
                      ),
                      statusRow(
                        'На продаже',
                        countStatus('На продаже'),
                      ),
                      statusRow(
                        'Продан',
                        countStatus('Продан'),
                      ),
                    ],
                  ),
                ),
              ),
              const SizedBox(height: 20),
              if (cars.isEmpty)
                const Card(
                  child: Padding(
                    padding: EdgeInsets.all(24),
                    child: Column(
                      children: [
                        Icon(
                          Icons.directions_car_outlined,
                          size: 56,
                        ),
                        SizedBox(height: 12),
                        Text(
                          'Автомобилей пока нет',
                          style: TextStyle(
                            fontSize: 18,
                            fontWeight:
                                FontWeight.bold,
                          ),
                        ),
                        SizedBox(height: 8),
                        Text(
                          'Нажмите «Добавить авто», чтобы создать первую карточку.',
                          textAlign:
                              TextAlign.center,
                        ),
                      ],
                    ),
                  ),
                )
              else
                ...cars.map(
                  (car) => Card(
                    child: ListTile(
                      leading:
                          const CircleAvatar(
                        child: Icon(
                          Icons.directions_car,
                        ),
                      ),
                      title: Text(
                        '${car.make} ${car.model}',
                      ),
                      subtitle: Text(
                        '${car.year} • ${car.status}\n'
                        'Вложено: ${money(car.invested)}',
                      ),
                      isThreeLine: true,
                      trailing: const Icon(
                        Icons.chevron_right,
                      ),
                      onTap: () => openCar(car),
                    ),
                  ),
                ),
              const SizedBox(height: 100),
            ],
          ),
        );
      }

      Widget statusRow(
        String title,
        int count,
      ) {
        return Padding(
          padding:
              const EdgeInsets.symmetric(vertical: 5),
          child: Row(
            mainAxisAlignment:
                MainAxisAlignment.spaceBetween,
            children: [
              Text(title),
              Text(
                '$count',
                style: const TextStyle(
                  fontWeight: FontWeight.bold,
                ),
              ),
            ],
          ),
        );
      }
    }

    class StatCard extends StatelessWidget {
      final String title;
      final String value;
      final IconData icon;

      const StatCard({
        super.key,
        required this.title,
        required this.value,
        required this.icon,
      });

      @override
      Widget build(BuildContext context) {
        return Card(
          child: Padding(
            padding: const EdgeInsets.all(14),
            child: Column(
              crossAxisAlignment:
                  CrossAxisAlignment.start,
              children: [
                Icon(icon),
                const SizedBox(height: 8),
                Text(title),
                const SizedBox(height: 4),
                Text(
                  value,
                  style: const TextStyle(
                    fontSize: 18,
                    fontWeight: FontWeight.bold,
                  ),
                ),
              ],
            ),
          ),
        );
      }
    }

    String money(double value) {
      return '${value.toStringAsFixed(0)} ₽';
    }
    EOF

- name: Create car forms
  run: |
    cat >> lib/main.dart <<'EOF'
    class CarFormScreen extends StatefulWidget {
  final void Function(Car car) onSave;

  const CarFormScreen({
    super.key,
    required this.onSave,
  });

  @override
  State<CarFormScreen> createState() =>
      _CarFormScreenState();
}

class _CarFormScreenState
    extends State<CarFormScreen> {
  final make = TextEditingController();
  final model = TextEditingController();
  final year = TextEditingController();
  final vin = TextEditingController();
  final plate = TextEditingController();
  final mileage = TextEditingController();
  final purchase = TextEditingController();
  final seller = TextEditingController();
  final notes = TextEditingController();

  String status = 'Куплен';

  @override
  void dispose() {
    make.dispose();
    model.dispose();
    year.dispose();
    vin.dispose();
    plate.dispose();
    mileage.dispose();
    purchase.dispose();
    seller.dispose();
    notes.dispose();
    super.dispose();
  }

  void save() {
    if (make.text.trim().isEmpty ||
        model.text.trim().isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text(
            'Введите марку и модель',
          ),
        ),
      );
      return;
    }

    widget.onSave(
      Car(
        make: make.text.trim(),
        model: model.text.trim(),
        year: year.text.trim(),
        vin: vin.text.trim(),
        plate: plate.text.trim(),
        mileage: mileage.text.trim(),
        purchasePrice: purchase.text.trim(),
        status: status,
        seller: seller.text.trim(),
        notes: notes.text.trim(),
        salePrice: '',
        expenses: [],
      ),
    );

    Navigator.pop(context);
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text(
          'Новый автомобиль',
        ),
      ),
      body: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          field(make, 'Марка'),
          field(model, 'Модель'),
          field(year, 'Год'),
          field(vin, 'VIN'),
          field(plate, 'Госномер'),
          field(mileage, 'Пробег'),
          field(
            purchase,
            'Цена покупки',
            number: true,
          ),
          field(seller, 'Продавец'),
          field(
            notes,
            'Примечания',
            lines: 4,
          ),
          const SizedBox(height: 4),
          DropdownButtonFormField<String>(
            initialValue: status,
            decoration: const InputDecoration(
              labelText: 'Статус',
              border: OutlineInputBorder(),
            ),
            items: const [
              DropdownMenuItem(
                value: 'Куплен',
                child: Text('Куплен'),
              ),
              DropdownMenuItem(
                value: 'В ремонте',
                child: Text('В ремонте'),
              ),
              DropdownMenuItem(
                value: 'Готов к продаже',
                child: Text(
                  'Готов к продаже',
                ),
              ),
              DropdownMenuItem(
                value: 'На продаже',
                child: Text('На продаже'),
              ),
              DropdownMenuItem(
                value: 'Продан',
                child: Text('Продан'),
              ),
            ],
            onChanged: (value) {
              if (value != null) {
                setState(() {
                  status = value;
                });
              }
            },
          ),
          const SizedBox(height: 16),
          FilledButton.icon(
            onPressed: save,
            icon: const Icon(Icons.save),
            label: const Text(
              'Сохранить автомобиль',
            ),
          ),
        ],
      ),
    );
  }

  Widget field(
    TextEditingController controller,
    String label, {
    bool number = false,
    int lines = 1,
  }) {
    return Padding(
      padding: const EdgeInsets.only(
        bottom: 10,
      ),
      child: TextField(
        controller: controller,
        maxLines: lines,
        keyboardType: number
            ? const TextInputType.numberWithOptions(
                decimal: true,
              )
            : TextInputType.text,
        decoration: InputDecoration(
          labelText: label,
          border: const OutlineInputBorder(),
        ),
      ),
    );
  }
}

class CarDetailsScreen extends StatefulWidget {
  final Car car;
  final VoidCallback onChanged;

  const CarDetailsScreen({
    super.key,
    required this.car,
    required this.onChanged,
  });

  @override
  State<CarDetailsScreen> createState() =>
      _CarDetailsScreenState();
}

class _CarDetailsScreenState
    extends State<CarDetailsScreen> {
  final salePrice = TextEditingController();

  @override
  void initState() {
    super.initState();
    salePrice.text = widget.car.salePrice;
  }

  @override
  void dispose() {
    salePrice.dispose();
    super.dispose();
  }

  void saveSalePrice() {
    setState(() {
      widget.car.salePrice =
          salePrice.text.trim();
    });

    widget.onChanged();

    ScaffoldMessenger.of(context).showSnackBar(
      const SnackBar(
        content: Text(
          'Цена продажи сохранена',
        ),
      ),
    );
  }

  void addExpense() {
    final category =
        TextEditingController();
    final amount =
        TextEditingController();
    final note =
        TextEditingController();

    showDialog(
      context: context,
      builder: (dialogContext) {
        return AlertDialog(
          title: const Text(
            'Добавить расход',
          ),
          content: SingleChildScrollView(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                TextField(
                  controller: category,
                  decoration:
                      const InputDecoration(
                    labelText: 'Категория',
                    border:
                        OutlineInputBorder(),
                  ),
                ),
                const SizedBox(height: 10),
                TextField(
                  controller: amount,
                  keyboardType:
                      const TextInputType
                          .numberWithOptions(
                    decimal: true,
                  ),
                  decoration:
                      const InputDecoration(
                    labelText: 'Сумма',
                    border:
                        OutlineInputBorder(),
                  ),
                ),
                const SizedBox(height: 10),
                TextField(
                  controller: note,
                  maxLines: 3,
                  decoration:
                      const InputDecoration(
                    labelText: 'Комментарий',
                    border:
                        OutlineInputBorder(),
                  ),
                ),
              ],
            ),
          ),
          actions: [
            TextButton(
              onPressed: () {
                Navigator.pop(
                  dialogContext,
                );
              },
              child: const Text('Отмена'),
            ),
            FilledButton(
              onPressed: () {
                final value =
                    double.tryParse(
                          amount.text
                              .replaceAll(
                            ',',
                            '.',
                          ),
                        ) ??
                        0;

                if (category.text
                        .trim()
                        .isEmpty ||
                    value <= 0) {
                  return;
                }

                setState(() {
                  widget.car.expenses.add(
                    Expense(
                      category:
                          category.text.trim(),
                      amount: value,
                      note: note.text.trim(),
                    ),
                  );
                });

                widget.onChanged();

                Navigator.pop(
                  dialogContext,
                );
              },
              child: const Text('Добавить'),
            ),
          ],
        );
      },
    );
  }

  @override
  Widget build(BuildContext context) {
    final car = widget.car;

    return Scaffold(
      appBar: AppBar(
        title: Text(
          '${car.make} ${car.model}',
        ),
      ),
      body: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  Text(
                    '${car.make} ${car.model}',
                    style: const TextStyle(
                      fontSize: 24,
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 10),
                  Text('Год: ${car.year}'),
                  Text('VIN: ${car.vin}'),
                  Text(
                    'Госномер: ${car.plate}',
                  ),
                  Text(
                    'Пробег: ${car.mileage}',
                  ),
                  Text(
                    'Продавец: ${car.seller}',
                  ),
                  Text(
                    'Статус: ${car.status}',
                  ),
                ],
              ),
            ),
          ),
          const SizedBox(height: 12),
          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  const Text(
                    'Финансы',
                    style: TextStyle(
                      fontSize: 19,
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 12),
                  financeRow(
                    'Цена покупки',
                    car.purchase,
                  ),
                  financeRow(
                    'Расходы',
                    car.expensesTotal,
                  ),
                  const Divider(),
                  financeRow(
                    'Всего вложено',
                    car.invested,
                    bold: true,
                  ),
                  financeRow(
                    'Цена продажи',
                    car.sale,
                  ),
                  financeRow(
                    'Прибыль',
                    car.profit,
                    bold: true,
                  ),
                ],
              ),
            ),
          ),
          const SizedBox(height: 12),
          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  const Text(
                    'Цена продажи',
                    style: TextStyle(
                      fontSize: 18,
                      fontWeight:
                          FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 10),
                  TextField(
                    controller: salePrice,
                    keyboardType:
                        const TextInputType
                            .numberWithOptions(
                      decimal: true,
                    ),
                    decoration:
                        const InputDecoration(
                      labelText:
                          'Цена продажи',
                      border:
                          OutlineInputBorder(),
                    ),
                  ),
                  const SizedBox(height: 10),
                  FilledButton(
                    onPressed:
                        saveSalePrice,
                    child: const Text(
                      'Сохранить',
                    ),
                  ),
                ],
              ),
            ),
          ),
          const SizedBox(height: 12),
          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  Row(
                    mainAxisAlignment:
                        MainAxisAlignment
                            .spaceBetween,
                    children: [
                      const Text(
                        'Расходы',
                        style: TextStyle(
                          fontSize: 18,
                          fontWeight:
                              FontWeight.bold,
                        ),
                      ),
                      IconButton(
                        onPressed:
                            addExpense,
                        icon: const Icon(
                          Icons.add,
                        ),
                      ),
                    ],
                  ),
                  if (car.expenses.isEmpty)
                    const Text(
                      'Расходов пока нет',
                    )
                  else
                    ...car.expenses.map(
                      (expense) => ListTile(
                        contentPadding:
                            EdgeInsets.zero,
                        title: Text(
                          expense.category,
                        ),
                        subtitle: Text(
                          expense.note.isEmpty
                              ? 'Расход'
                              : expense.note,
                        ),
                        trailing: Text(
                          money(
                            expense.amount,
                          ),
                          style:
                              const TextStyle(
                            fontWeight:
                                FontWeight.bold,
                          ),
                        ),
                      ),
                    ),
                ],
              ),
            ),
          ),
          if (car.notes.isNotEmpty) ...[
            const SizedBox(height: 12),
            Card(
              child: Padding(
                padding:
                    const EdgeInsets.all(16),
                child: Column(
                  crossAxisAlignment:
                      CrossAxisAlignment.start,
                  children: [
                    const Text(
                      'Примечания',
                      style: TextStyle(
                        fontSize: 18,
                        fontWeight:
                            FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 8),
                    Text(car.notes),
                  ],
                ),
              ),
            ),
          ],
          const SizedBox(height: 30),
        ],
      ),
    );
  }

  Widget financeRow(
    String title,
    double value, {
    bool bold = false,
  }) {
    return Padding(
      padding:
          const EdgeInsets.symmetric(
        vertical: 4,
      ),
      child: Row(
        mainAxisAlignment:
            MainAxisAlignment.spaceBetween,
        children: [
          Text(
            title,
            style: TextStyle(
              fontWeight: bold
                  ? FontWeight.bold
                  : null,
            ),
          ),
          Text(
            money(value),
            style: TextStyle(
              fontWeight: bold
                  ? FontWeight.bold
                  : null,
            ),
          ),
        ],
      ),
    );
  }
}
EOF
- name: Get dependencies
  run: |
    flutter pub get

- name: Analyze project
  run: |
    flutter analyze

- name: Build APK
  run: |
    flutter build apk --release

- name: Check APK
  run: |
    echo "Проверяем APK..."
    ls -lah build/app/outputs/flutter-apk/
    test -f build/app/outputs/flutter-apk/app-release.apk
    echo "APK успешно создан."

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: auto-profit-apk
    path: build/app/outputs/flutter-apk/app-release.apk
    if-no-files-found: error
