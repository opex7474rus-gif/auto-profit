name: Auto Profit BUILD

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Recreate Android project files
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name auto_profit

      - name: Add INTERNET permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' $MANIFEST; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          fi

      - name: Add queries for url_launcher
        run: |
          python3 - <<'PY'
          import pathlib
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          if 'android.intent.action.VIEW' in s:
              print('Queries already present')
          else:
              nl = chr(10)
              q = '<queries>' + nl
              q += '        <intent>' + nl
              q += '            <action android:name="android.intent.action.VIEW" />' + nl
              q += '            <data android:scheme="https" />' + nl
              q += '        </intent>' + nl
              q += '        <intent>' + nl
              q += '            <action android:name="android.intent.action.VIEW" />' + nl
              q += '            <data android:scheme="http" />' + nl
              q += '        </intent>' + nl
              q += '        <intent>' + nl
              q += '            <action android:name="android.intent.action.VIEW" />' + nl
              q += '            <data android:scheme="content" />' + nl
              q += '        </intent>' + nl
              q += '        <intent>' + nl
              q += '            <action android:name="android.intent.action.VIEW" />' + nl
              q += '            <data android:scheme="file" />' + nl
              q += '        </intent>' + nl
              q += '    </queries>' + nl
              q += '</manifest>'
              s = s.replace('</manifest>', q)
              m.write_text(s)
              print('Queries added')
          PY

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Patch build.gradle.kts for signing
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle.kts")
          src = p.read_text()
          if "signingConfigs" not in src:
              block = '''
              signingConfigs {
                  create("release") {
                      val keystoreProperties = java.util.Properties()
                      val keystorePropertiesFile = rootProject.file("key.properties")
                      if (keystorePropertiesFile.exists()) {
                          keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
                      }
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }
              '''
              src = src.replace("android {", "android {" + block, 1)
          if "signingConfig = signingConfigs.getByName" not in src:
              src = re.sub(
                  r'(release\s*\{)',
                  r'\1\n            signingConfig = signingConfigs.getByName("release")',
                  src,
                  count=1,
              )
          p.write_text(src)
          print("build.gradle.kts обновлён")
          PY

      - name: Bump version automatically
        run: |
          VERSION="1.0.0+${{ github.run_number }}"
          sed -i "s/^version: .*/version: $VERSION/" pubspec.yaml
          echo "Автоматическая версия: $VERSION"

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure launcher icon
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            convert -size 1024x1024 xc:'#1565C0' \
              -gravity center -fill white -pointsize 400 \
              -annotate 0 'AP' assets/icon.png
          fi

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          ls -lah build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-profit-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  build_web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Ensure web folder exists
        run: |
          mkdir -p web
          if [ ! -f web/index.html ]; then
            echo "web/index.html отсутствует — создаём дефолтный"
            flutter create . --platforms=web --project-name auto_profit
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure launcher icon
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            convert -size 1024x1024 xc:'#1565C0' \
              -gravity center -fill white -pointsize 400 \
              -annotate 0 'AP' assets/icon.png
          fi

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build Web
        run: flutter build web --release --base-href=/auto-profit/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
