name: Build Auto Profit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Prepare Flutter project
        run: |
          mkdir -p lib
          mkdir -p test

          if [ -d "screens" ]; then
            mkdir -p lib/screens
            cp screens/*.dart lib/screens/
          fi

          if [ -d "models" ]; then
            mkdir -p lib/models
            cp models/*.dart lib/models/
          fi

          if [ -d "repositories" ]; then
            mkdir -p lib/repositories
            cp repositories/*.dart lib/repositories/
          fi

          if [ -d "data" ]; then
            mkdir -p lib/data
            cp data/*.dart lib/data/
          fi

          if [ -d "services" ]; then
            mkdir -p lib/services
            cp services/*.dart lib/services/
          fi

          cp main.dart lib/main.dart
          cp widget_test.dart test/widget_test.dart

      - name: Create Android project
        run: |
          flutter create . --platforms=android --project-name auto_profit

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-profit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
