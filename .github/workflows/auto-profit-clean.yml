name: Auto Profit CLEAN BUILD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Clean old project
        shell: bash
        run: |
          set -e

          rm -rf lib
          rm -rf test
          rm -rf android
          rm -rf ios
          rm -rf macos
          rm -rf linux
          rm -rf windows
          rm -rf web

          mkdir -p lib

      - name: Create pubspec
        shell: bash
        run: |
          set -e

          cat > pubspec.yaml <<'YAML'
          name: auto_profit
          description: Авто Профит
          publish_to: "none"

          version: 1.0.0+1

          environment:
            sdk: ">=3.5.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^5.0.0

          flutter:
            uses-material-design: true
          YAML

      - name: Create Flutter project
        shell: bash
        run: |
          set -e

          flutter create . \
            --platforms=android \
            --project-name auto_profit

      - name: Remove generated Dart files
        shell: bash
        run: |
          set -e

          rm -rf lib
          rm -rf test

          mkdir -p lib
                - name: Create main.dart
        shell: bash
        run: |
          set -e

          cat > lib/main.dart <<'DART'
import 'package:flutter/material.dart';

void main() {
  runApp(const AutoProfitApp());
}

class AutoProfitApp extends StatelessWidget {
  const AutoProfitApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'Авто Профит',
      debugShowCheckedModeBanner: false,
      theme: ThemeData(
        colorScheme: ColorScheme.fromSeed(
          seedColor: Colors.blue,
        ),
        useMaterial3: true,
      ),
      home: const HomeScreen(),
    );
  }
}

class Car {
  String make;
  String model;
  String year;
  String vin;
  String plate;
  String mileage;
  String purchaseDate;
  double purchasePrice;
  double salePrice;
  String seller;
  String notes;
  String status;
  List<Expense> expenses;

  Car({
    required this.make,
    required this.model,
    required this.year,
    required this.vin,
    required this.plate,
    required this.mileage,
    required this.purchaseDate,
    required this.purchasePrice,
    required this.salePrice,
    required this.seller,
    required this.notes,
    required this.status,
    required this.expenses,
  });

  double get expensesTotal {
    return expenses.fold(
      0,
      (sum, expense) => sum + expense.amount,
    );
  }

  double get invested {
    return purchasePrice + expensesTotal;
  }

  double get profit {
    return salePrice - invested;
  }
}

class Expense {
  String category;
  double amount;
  String date;
  String note;

  Expense({
    required this.category,
    required this.amount,
    required this.date,
    required this.note,
  });
}

class HomeScreen extends StatefulWidget {
  const HomeScreen({super.key});

  @override
  State<HomeScreen> createState() => _HomeScreenState();
}

class _HomeScreenState extends State<HomeScreen> {
  final List<Car> cars = [];

  int get boughtCount {
    return cars.where((car) => car.status == 'Куплен').length;
  }

  int get repairCount {
    return cars.where((car) => car.status == 'В ремонте').length;
  }

  int get readyCount {
    return cars.where(
      (car) => car.status == 'Готов к продаже',
    ).length;
  }

  int get saleCount {
    return cars.where(
      (car) => car.status == 'На продаже',
    ).length;
  }

  int get soldCount {
    return cars.where((car) => car.status == 'Продан').length;
  }

  double get totalInvested {
    return cars.fold(
      0,
      (sum, car) => sum + car.invested,
    );
  }

  double get totalRevenue {
    return cars.fold(
      0,
      (sum, car) => sum + car.salePrice,
    );
  }

  double get totalProfit {
    return cars.fold(
      0,
      (sum, car) => sum + car.profit,
    );
  }

  void addCar() {
    Navigator.of(context).push(
      MaterialPageRoute(
        builder: (_) => CarFormScreen(
          onSave: (car) {
            setState(() {
              cars.add(car);
            });
          },
        ),
      ),
    );
  }

  void openCar(Car car) {
    Navigator.of(context).push(
      MaterialPageRoute(
        builder: (_) => CarDetailsScreen(
          car: car,
          onChanged: () {
            setState(() {});
          },
        ),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('Авто Профит'),
      ),
      floatingActionButton: FloatingActionButton.extended(
        onPressed: addCar,
        icon: const Icon(Icons.add),
        label: const Text('Добавить авто'),
      ),
      body: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          const Text(
            'Панель управления',
            style: TextStyle(
              fontSize: 24,
              fontWeight: FontWeight.bold,
            ),
          ),
          const SizedBox(height: 16),

          Row(
            children: [
              Expanded(
                child: StatCard(
                  title: 'Всего авто',
                  value: '${cars.length}',
                  icon: Icons.directions_car,
                ),
              ),
              const SizedBox(width: 10),
              Expanded(
                child: StatCard(
                  title: 'На продаже',
                  value: '$saleCount',
                  icon: Icons.sell,
                ),
              ),
            ],
          ),

          const SizedBox(height: 10),

          Row(
            children: [
              Expanded(
                child: StatCard(
                  title: 'Инвестировано',
                  value: money(totalInvested),
                  icon: Icons.account_balance_wallet,
                ),
              ),
              const SizedBox(width: 10),
              Expanded(
                child: StatCard(
                  title: 'Прибыль',
                  value: money(totalProfit),
                  icon: Icons.trending_up,
                ),
              ),
            ],
          ),

          const SizedBox(height: 20),

          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  const Text(
                    'Статусы',
                    style: TextStyle(
                      fontSize: 18,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 12),
                  statusRow('Куплен', boughtCount),
                  statusRow('В ремонте', repairCount),
                  statusRow(
                    'Готов к продаже',
                    readyCount,
                  ),
                  statusRow('На продаже', saleCount),
                  statusRow('Продан', soldCount),
                ],
              ),
            ),
          ),

          const SizedBox(height: 20),

          if (cars.isEmpty)
            const Card(
              child: Padding(
                padding: EdgeInsets.all(24),
                child: Column(
                  children: [
                    Icon(
                      Icons.directions_car_outlined,
                      size: 56,
                    ),
                    SizedBox(height: 12),
                    Text(
                      'Автомобилей пока нет',
                      style: TextStyle(
                        fontSize: 18,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    SizedBox(height: 6),
                    Text(
                      'Нажмите «Добавить авто», чтобы создать первую карточку.',
                      textAlign: TextAlign.center,
                    ),
                  ],
                ),
              ),
            )
          else
            ...cars.map(
              (car) => Card(
                child: ListTile(
                  leading: const CircleAvatar(
                    child: Icon(Icons.directions_car),
                  ),
                  title: Text(
                    '${car.make} ${car.model}',
                  ),
                  subtitle: Text(
                    '${car.year} • ${car.status}\n'
                    'Вложено: ${money(car.invested)}',
                  ),
                  isThreeLine: true,
                  trailing: const Icon(
                    Icons.chevron_right,
                  ),
                  onTap: () => openCar(car),
                ),
              ),
            ),

          const SizedBox(height: 100),
        ],
      ),
    );
  }

  Widget statusRow(String title, int count) {
    return Padding(
      padding: const EdgeInsets.symmetric(vertical: 5),
      child: Row(
        mainAxisAlignment:
            MainAxisAlignment.spaceBetween,
        children: [
          Text(title),
          Text(
            '$count',
            style: const TextStyle(
              fontWeight: FontWeight.bold,
            ),
          ),
        ],
      ),
    );
  }
}

class StatCard extends StatelessWidget {
  final String title;
  final String value;
  final IconData icon;

  const StatCard({
    super.key,
    required this.title,
    required this.value,
    required this.icon,
  });

  @override
  Widget build(BuildContext context) {
    return Card(
      child: Padding(
        padding: const EdgeInsets.all(14),
        child: Column(
          crossAxisAlignment:
              CrossAxisAlignment.start,
          children: [
            Icon(icon, size: 28),
            const SizedBox(height: 8),
            Text(
              title,
              style: const TextStyle(fontSize: 13),
            ),
            const SizedBox(height: 4),
            Text(
              value,
              style: const TextStyle(
                fontSize: 18,
                fontWeight: FontWeight.bold,
              ),
            ),
          ],
        ),
      ),
    );
  }
}

String money(double value) {
  return '${value.toStringAsFixed(0)} ₽';
}
