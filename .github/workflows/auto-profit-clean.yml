      - name: Add car screens
        shell: bash
        run: |
          set -e

          cat >> lib/main.dart <<'DART'

class CarFormScreen extends StatefulWidget {
  final void Function(Car car) onSave;

  const CarFormScreen({
    super.key,
    required this.onSave,
  });

  @override
  State<CarFormScreen> createState() =>
      _CarFormScreenState();
}

class _CarFormScreenState extends State<CarFormScreen> {
  final makeController = TextEditingController();
  final modelController = TextEditingController();
  final yearController = TextEditingController();
  final vinController = TextEditingController();
  final plateController = TextEditingController();
  final mileageController = TextEditingController();
  final purchasePriceController =
      TextEditingController();
  final sellerController = TextEditingController();
  final notesController = TextEditingController();

  String status = 'Куплен';

  @override
  void dispose() {
    makeController.dispose();
    modelController.dispose();
    yearController.dispose();
    vinController.dispose();
    plateController.dispose();
    mileageController.dispose();
    purchasePriceController.dispose();
    sellerController.dispose();
    notesController.dispose();
    super.dispose();
  }

  void save() {
    final make = makeController.text.trim();
    final model = modelController.text.trim();

    if (make.isEmpty || model.isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(
          content: Text(
            'Заполните марку и модель автомобиля',
          ),
        ),
      );
      return;
    }

    final purchasePrice =
        double.tryParse(
              purchasePriceController.text
                  .replaceAll(',', '.'),
            ) ??
            0;

    final car = Car(
      make: make,
      model: model,
      year: yearController.text.trim(),
      vin: vinController.text.trim(),
      plate: plateController.text.trim(),
      mileage: mileageController.text.trim(),
      purchaseDate: '',
      purchasePrice: purchasePrice,
      salePrice: 0,
      seller: sellerController.text.trim(),
      notes: notesController.text.trim(),
      status: status,
      expenses: [],
    );

    widget.onSave(car);
    Navigator.of(context).pop();
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('Новый автомобиль'),
      ),
      body: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          field(
            makeController,
            'Марка',
          ),
          field(
            modelController,
            'Модель',
          ),
          field(
            yearController,
            'Год',
            number: true,
          ),
          field(
            vinController,
            'VIN',
          ),
          field(
            plateController,
            'Госномер',
          ),
          field(
            mileageController,
            'Пробег',
            number: true,
          ),
          field(
            purchasePriceController,
            'Цена покупки',
            number: true,
          ),
          field(
            sellerController,
            'Продавец',
          ),
          field(
            notesController,
            'Примечания',
            lines: 4,
          ),

          const SizedBox(height: 4),

          DropdownButtonFormField<String>(
            initialValue: status,
            decoration: const InputDecoration(
              labelText: 'Статус',
              border: OutlineInputBorder(),
            ),
            items: const [
              DropdownMenuItem(
                value: 'Куплен',
                child: Text('Куплен'),
              ),
              DropdownMenuItem(
                value: 'В ремонте',
                child: Text('В ремонте'),
              ),
              DropdownMenuItem(
                value: 'Готов к продаже',
                child: Text('Готов к продаже'),
              ),
              DropdownMenuItem(
                value: 'На продаже',
                child: Text('На продаже'),
              ),
              DropdownMenuItem(
                value: 'Продан',
                child: Text('Продан'),
              ),
            ],
            onChanged: (value) {
              if (value != null) {
                setState(() {
                  status = value;
                });
              }
            },
          ),

          const SizedBox(height: 16),

          FilledButton.icon(
            onPressed: save,
            icon: const Icon(Icons.save),
            label: const Text(
              'Сохранить автомобиль',
            ),
          ),
        ],
      ),
    );
  }

  Widget field(
    TextEditingController controller,
    String label, {
    bool number = false,
    int lines = 1,
  }) {
    return Padding(
      padding: const EdgeInsets.only(bottom: 10),
      child: TextField(
        controller: controller,
        maxLines: lines,
        keyboardType: number
            ? const TextInputType.numberWithOptions(
                decimal: true,
              )
            : TextInputType.text,
        decoration: InputDecoration(
          labelText: label,
          border: const OutlineInputBorder(),
        ),
      ),
    );
  }
}

class CarDetailsScreen extends StatefulWidget {
  final Car car;
  final VoidCallback onChanged;

  const CarDetailsScreen({
    super.key,
    required this.car,
    required this.onChanged,
  });

  @override
  State<CarDetailsScreen> createState() =>
      _CarDetailsScreenState();
}

class _CarDetailsScreenState
    extends State<CarDetailsScreen> {
  final salePriceController =
      TextEditingController();

  @override
  void initState() {
    super.initState();

    if (widget.car.salePrice > 0) {
      salePriceController.text =
          widget.car.salePrice.toStringAsFixed(0);
    }
  }

  @override
  void dispose() {
    salePriceController.dispose();
    super.dispose();
  }

  void addExpense() {
    final categoryController =
        TextEditingController();
    final amountController =
        TextEditingController();
    final noteController =
        TextEditingController();

    showDialog(
      context: context,
      builder: (dialogContext) {
        return AlertDialog(
          title: const Text('Добавить расход'),
          content: SingleChildScrollView(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                TextField(
                  controller: categoryController,
                  decoration: const InputDecoration(
                    labelText: 'Категория',
                    border: OutlineInputBorder(),
                  ),
                ),
                const SizedBox(height: 10),
                TextField(
                  controller: amountController,
                  keyboardType:
                      const TextInputType.numberWithOptions(
                    decimal: true,
                  ),
                  decoration: const InputDecoration(
                    labelText: 'Сумма',
                    border: OutlineInputBorder(),
                  ),
                ),
                const SizedBox(height: 10),
                TextField(
                  controller: noteController,
                  maxLines: 3,
                  decoration: const InputDecoration(
                    labelText: 'Комментарий',
                    border: OutlineInputBorder(),
                  ),
                ),
              ],
            ),
          ),
          actions: [
            TextButton(
              onPressed: () {
                Navigator.of(dialogContext).pop();
              },
              child: const Text('Отмена'),
            ),
            FilledButton(
              onPressed: () {
                final category =
                    categoryController.text.trim();

                final amount =
                    double.tryParse(
                          amountController.text
                              .replaceAll(',', '.'),
                        ) ??
                        0;

                if (category.isEmpty || amount <= 0) {
                  return;
                }

                setState(() {
                  widget.car.expenses.add(
                    Expense(
                      category: category,
                      amount: amount,
                      date: '',
                      note: noteController.text.trim(),
                    ),
                  );
                });

                widget.onChanged();
                Navigator.of(dialogContext).pop();
              },
              child: const Text('Добавить'),
            ),
          ],
        );
      },
    );
  }

  void saveSalePrice() {
    final value =
        double.tryParse(
              salePriceController.text
                  .replaceAll(',', '.'),
            ) ??
            0;

    setState(() {
      widget.car.salePrice = value;
    });

    widget.onChanged();

    ScaffoldMessenger.of(context).showSnackBar(
      const SnackBar(
        content: Text('Цена продажи сохранена'),
      ),
    );
  }

  @override
  Widget build(BuildContext context) {
    final car = widget.car;

    return Scaffold(
      appBar: AppBar(
        title: Text('${car.make} ${car.model}'),
      ),
      body: ListView(
        padding: const EdgeInsets.all(16),
        children: [
          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  Text(
                    '${car.make} ${car.model}',
                    style: const TextStyle(
                      fontSize: 24,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 8),
                  Text('Год: ${car.year}'),
                  Text('VIN: ${car.vin}'),
                  Text('Госномер: ${car.plate}'),
                  Text('Пробег: ${car.mileage}'),
                  Text('Продавец: ${car.seller}'),
                  Text('Статус: ${car.status}'),
                ],
              ),
            ),
          ),

          const SizedBox(height: 12),

          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  const Text(
                    'Финансы',
                    style: TextStyle(
                      fontSize: 19,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 12),
                  financeRow(
                    'Цена покупки',
                    car.purchasePrice,
                  ),
                  financeRow(
                    'Расходы',
                    car.expensesTotal,
                  ),
                  const Divider(),
                  financeRow(
                    'Всего вложено',
                    car.invested,
                  ),
                  financeRow(
                    'Цена продажи',
                    car.salePrice,
                  ),
                  financeRow(
                    'Прибыль',
                    car.profit,
                    bold: true,
                  ),
                ],
              ),
            ),
          ),

          const SizedBox(height: 12),

          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  const Text(
                    'Цена продажи',
                    style: TextStyle(
                      fontSize: 18,
                      fontWeight: FontWeight.bold,
                    ),
                  ),
                  const SizedBox(height: 10),
                  TextField(
                    controller: salePriceController,
                    keyboardType:
                        const TextInputType.numberWithOptions(
                      decimal: true,
                    ),
                    decoration: const InputDecoration(
                      labelText: 'Цена продажи',
                      border: OutlineInputBorder(),
                    ),
                  ),
                  const SizedBox(height: 10),
                  FilledButton(
                    onPressed: saveSalePrice,
                    child: const Text(
                      'Сохранить цену продажи',
                    ),
                  ),
                ],
              ),
            ),
          ),

          const SizedBox(height: 12),

          Card(
            child: Padding(
              padding: const EdgeInsets.all(16),
              child: Column(
                crossAxisAlignment:
                    CrossAxisAlignment.start,
                children: [
                  Row(
                    mainAxisAlignment:
                        MainAxisAlignment.spaceBetween,
                    children: [
                      const Text(
                        'Расходы',
                        style: TextStyle(
                          fontSize: 18,
                          fontWeight: FontWeight.bold,
                        ),
                      ),
                      IconButton(
                        onPressed: addExpense,
                        icon: const Icon(Icons.add),
                        tooltip: 'Добавить расход',
                      ),
                    ],
                  ),

                  if (car.expenses.isEmpty)
                    const Padding(
                      padding: EdgeInsets.only(top: 8),
                      child: Text(
                        'Расходов пока нет',
                      ),
                    )
                  else
                    ...car.expenses.map(
                      (expense) => ListTile(
                        contentPadding: EdgeInsets.zero,
                        title: Text(
                          expense.category,
                        ),
                        subtitle: Text(
                          expense.note.isEmpty
                              ? 'Расход'
                              : expense.note,
                        ),
                        trailing: Text(
                          money(expense.amount),
                          style: const TextStyle(
                            fontWeight: FontWeight.bold,
                          ),
                        ),
                      ),
                    ),
                ],
              ),
            ),
          ),

          const SizedBox(height: 12),

          if (car.notes.isNotEmpty)
            Card(
              child: Padding(
                padding: const EdgeInsets.all(16),
                child: Column(
                  crossAxisAlignment:
                      CrossAxisAlignment.start,
                  children: [
                    const Text(
                      'Примечания',
                      style: TextStyle(
                        fontSize: 18,
                        fontWeight: FontWeight.bold,
                      ),
                    ),
                    const SizedBox(height: 8),
                    Text(car.notes),
                  ],
                ),
              ),
            ),

          const SizedBox(height: 30),
        ],
      ),
    );
  }

  Widget financeRow(
    String title,
    double value, {
    bool bold = false,
  }) {
    return Padding(
      padding: const EdgeInsets.symmetric(vertical: 4),
      child: Row(
        mainAxisAlignment:
            MainAxisAlignment.spaceBetween,
        children: [
          Text(
            title,
            style: TextStyle(
              fontWeight:
                  bold ? FontWeight.bold : null,
            ),
          ),
          Text(
            money(value),
            style: TextStyle(
              fontWeight:
                  bold ? FontWeight.bold : null,
            ),
          ),
        ],
      ),
    );
  }
}

DART
      - name: Get dependencies
        shell: bash
        run: |
          set -e
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          set -e
          flutter analyze

      - name: Build APK
        shell: bash
        run: |
          set -e
          flutter build apk --release

      - name: Check APK
        shell: bash
        run: |
          set -e

          echo "Проверяем созданный APK..."
          ls -lah build/app/outputs/flutter-apk/

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK найден:"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-profit-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
