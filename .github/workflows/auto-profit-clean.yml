name: Auto Profit BUILD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Recreate Android project files
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name auto_profit

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure launcher icon
        run: |
          mkdir -p assets
          if [ ! -f assets/icon.png ]; then
            echo "assets/icon.png не найден — генерирую стандартную иконку"
            convert -size 1024x1024 xc:'#1565C0' \
              -gravity center -fill white -pointsize 400 \
              -annotate 0 'AP' assets/icon.png
          else
            echo "Использую свою иконку assets/icon.png"
          fi

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Check APK
        run: |
          ls -lah build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-profit-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
